# Place this file at: .github/workflows/snake.yml  (in your username/username repo)
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours, on the hour
  workflow_dispatch:          # lets you run it manually
  push:
    branches:
      - main                  # change to "master" if that's your default branch

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2a6d&color_dots=#12122a,#0b4f5c,#0a8fa3,#00c8e0,#00f0ff

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
